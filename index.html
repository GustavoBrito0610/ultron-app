<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00D4FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>Ultron</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #050A15; color: #E0F4FF;
            display: flex; flex-direction: column;
        }
        header {
            background: linear-gradient(90deg, #0A1220, #0d1a2e);
            padding: 10px 14px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid #1a2a44;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(0, 212, 255, 0.08);
        }
        header .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, #00D4FF 0%, #0078a8 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.6);
            overflow: hidden;
            flex-shrink: 0;
        }
        header .avatar img { width: 100%; height: 100%; object-fit: cover; }
        header .info { display: flex; flex-direction: column; }
        header h1 { font-size: 16px; font-weight: 600; color: #00D4FF; letter-spacing: 0.5px; }
        header .sub { font-size: 11px; color: #4a9cc7; }
        header .acoes { margin-left: auto; display: flex; gap: 6px; }
        header .btn-h {
            background: transparent; border: 1px solid #1a2a44;
            color: #4a9cc7; padding: 6px 10px;
            border-radius: 8px; cursor: pointer; font-size: 14px;
        }
        header .btn-h:hover, header .btn-h.on { border-color: #00D4FF; color: #00D4FF; }

        #personas-bar {
            display: none;
            background: #0A1220;
            padding: 8px;
            gap: 6px;
            justify-content: center;
            border-bottom: 1px solid #1a2a44;
        }
        #personas-bar.show { display: flex; }
        .persona-btn {
            background: #0d1a2e; border: 1px solid #1a2a44;
            color: #E0F4FF; padding: 6px 14px;
            border-radius: 18px; cursor: pointer; font-size: 13px;
        }
        .persona-btn.on { background: linear-gradient(135deg, #00D4FF, #0078a8); border-color: #00D4FF; color: white; }

        #chat {
            flex: 1; overflow-y: auto;
            padding: 14px 12px 8px;
            display: flex; flex-direction: column; gap: 10px;
            scroll-behavior: smooth;
        }
        .msg-wrap { display: flex; align-items: flex-end; gap: 6px; max-width: 88%; }
        .msg-wrap.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-wrap.bot { align-self: flex-start; }

        .msg {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.45;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease;
            white-space: pre-wrap;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            background: linear-gradient(135deg, #0078a8, #00a8d4);
            color: white; border-bottom-right-radius: 4px;
        }
        .msg.bot {
            background: #0d1a2e; color: #E0F4FF;
            border: 1px solid #1a2a44; border-bottom-left-radius: 4px;
        }
        .msg.bot.typing { color: #4a9cc7; font-style: italic; }
        .typing-dots::after {
            content: '...';
            animation: dots 1.4s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .tag-pesquisa {
            display: inline-block;
            font-size: 10px;
            background: #1a3a5a;
            color: #4ac7ff;
            padding: 2px 6px;
            border-radius: 8px;
            margin-bottom: 4px;
        }
        .btn-speak {
            background: transparent; border: 1px solid #1a2a44;
            color: #4a9cc7; width: 32px; height: 32px;
            border-radius: 50%; cursor: pointer;
            font-size: 13px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-speak:hover { border-color: #00D4FF; color: #00D4FF; }
        .btn-speak.tocando { border-color: #00ff88; color: #00ff88; animation: pulse 1.5s infinite; }

        footer {
            padding: 10px 12px 14px;
            background: #0A1220;
            border-top: 1px solid #1a2a44;
            display: flex; gap: 8px; align-items: center;
            flex-shrink: 0;
        }
        #input {
            flex: 1; padding: 12px 16px;
            background: #0d1a2e; border: 1px solid #1a2a44;
            border-radius: 24px; color: #E0F4FF;
            font-size: 15px; outline: none;
        }
        #input:focus { border-color: #00D4FF; box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
        #input::placeholder { color: #4a7a99; }

        .btn-icone {
            width: 48px; height: 48px;
            background: #0d1a2e; border: 1px solid #1a2a44;
            border-radius: 50%; color: #4a9cc7;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.15s;
        }
        .btn-icone:hover { border-color: #00D4FF; color: #00D4FF; }
        .btn-icone:active { transform: scale(0.92); }
        .btn-icone.gravando {
            background: #ff3060; color: white; border-color: #ff3060;
            animation: pulse-rec 1s ease-in-out infinite;
        }
        @keyframes pulse-rec {
            0%, 100% { box-shadow: 0 0 12px rgba(255,48,96,0.6); }
            50% { box-shadow: 0 0 24px rgba(255,48,96,1); }
        }
        #send {
            background: linear-gradient(135deg, #00D4FF, #0078a8);
            border: none; color: white;
            box-shadow: 0 0 16px rgba(0,212,255,0.4);
        }
        #send:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

        #login {
            position: fixed; inset: 0; background: #050A15;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 24px; z-index: 100;
        }
        #login .logo-big {
            width: 90px; height: 90px;
            background: radial-gradient(circle, #00D4FF, #0078a8);
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-size: 44px; margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(0,212,255,0.6);
            animation: pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 12px rgba(0,212,255,0.5); }
            50% { box-shadow: 0 0 24px rgba(0,212,255,0.9); }
        }
        #login h2 { color: #00D4FF; margin-bottom: 8px; font-size: 24px; }
        #login p { color: #4a7a99; margin-bottom: 24px; font-size: 14px; }
        #senha {
            width: 100%; max-width: 320px;
            padding: 16px 20px; background: #0d1a2e;
            border: 1px solid #1a2a44; border-radius: 14px;
            color: #E0F4FF; font-size: 16px;
            text-align: center; outline: none; margin-bottom: 16px;
        }
        #senha:focus { border-color: #00D4FF; }
        #entrar {
            width: 100%; max-width: 320px; padding: 16px;
            background: linear-gradient(135deg, #00D4FF, #0078a8);
            border: none; border-radius: 14px;
            color: white; font-size: 16px; font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0,212,255,0.4);
        }
        .erro { color: #ff4466; font-size: 13px; margin-top: 12px; }
    </style>
</head>
<body>

    <div id="login">
        <div class="logo-big">🤖</div>
        <h2>ULTRON</h2>
        <p>Digite a senha para entrar</p>
        <input type="password" id="senha" placeholder="Senha" autocomplete="off">
        <button id="entrar">ENTRAR</button>
        <div class="erro" id="erro"></div>
    </div>

    <header>
        <div class="avatar" id="avatar-box">🤖</div>
        <div class="info">
            <h1>ULTRON</h1>
            <div class="sub" id="sub-nome">assistente pessoal</div>
        </div>
        <div class="acoes">
            <button class="btn-h" id="btn-persona" title="Trocar persona">🎭</button>
            <button class="btn-h" id="btn-voz" title="Voz ligada">🔊</button>
            <button class="btn-h" id="btn-clear" title="Limpar">🗑️</button>
        </div>
    </header>

    <div id="personas-bar">
        <button class="persona-btn on" data-p="ultron">🤖 Ultron</button>
        <button class="persona-btn" data-p="nox">🌙 Nox</button>
        <button class="persona-btn" data-p="nova">✨ Nova</button>
    </div>

    <div id="chat"></div>

    <footer>
        <button class="btn-icone" id="btn-mic" title="Falar">🎤</button>
        <input type="text" id="input" placeholder="Digite uma mensagem..." autocomplete="off">
        <button class="btn-icone" id="send" title="Enviar">➤</button>
    </footer>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const BASE_URL = "https://machinery-finder-solo-railway.trycloudflare.com";
        const API_KEY = "ultron-secret-2026";
        const SENHA_APP = "ultron2026";
        const MAX_HIST = 20;

        // ============================================================
        // ESTADO
        // ============================================================
        let usuarioId = localStorage.getItem("ultron_user_id") || ("user_" + Math.random().toString(36).substring(7));
        localStorage.setItem("ultron_user_id", usuarioId);

        let historico = JSON.parse(localStorage.getItem("ultron_historico") || "[]");
        let enviando = false;
        let gravando = false;
        let vozAtiva = localStorage.getItem("ultron_voz") !== "off";
        let persona = localStorage.getItem("ultron_persona") || "ultron";
        let audioAtual = null;

        const chat = document.getElementById("chat");
        const input = document.getElementById("input");
        const send = document.getElementById("send");
        const btnMic = document.getElementById("btn-mic");
        const btnClear = document.getElementById("btn-clear");
        const btnVoz = document.getElementById("btn-voz");
        const btnPersona = document.getElementById("btn-persona");
        const personaBar = document.getElementById("personas-bar");
        const avatarBox = document.getElementById("avatar-box");
        const subNome = document.getElementById("sub-nome");
        const login = document.getElementById("login");
        const senhaInput = document.getElementById("senha");
        const entrarBtn = document.getElementById("entrar");
        const erro = document.getElementById("erro");

        // ============================================================
        // LOGIN
        // ============================================================
        entrarBtn.addEventListener("click", () => {
            if (senhaInput.value === SENHA_APP) {
                localStorage.setItem("ultron_logado", "sim");
                login.style.display = "none";
                iniciar();
            } else {
                erro.textContent = "Senha incorreta";
            }
        });
        senhaInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") entrarBtn.click();
        });

        // ============================================================
        // VOZ
        // ============================================================
        function tocarAudio(url) {
            if (audioAtual) { audioAtual.pause(); audioAtual = null; }
            audioAtual = new Audio(url);
            audioAtual.play().catch(e => console.warn("audio:", e));
        }

        function falarRobotico(texto, btn) {
            if (!vozAtiva) return;
            if (btn) btn.classList.add("tocando");
            // Limpa emojis
            const limpo = texto
                .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
                .replace(/[\u{2600}-\u{27BF}]/gu, "")
                .replace(/\s+/g, " ")
                .trim();
            if (!limpo) return;

            fetch(BASE_URL + "/tts", {
                method: "POST",
                headers: { "Content-Type": "application/json", "x-api-key": API_KEY },
                body: JSON.stringify({ texto: limpo })
            })
            .then(r => r.ok ? r.blob() : Promise.reject("erro tts"))
            .then(blob => {
                const url = URL.createObjectURL(blob);
                tocarAudio(url);
                if (btn) {
                    const audio = new Audio(url);
                    audio.onended = () => btn.classList.remove("tocando");
                }
            })
            .catch(e => {
                console.warn("erro voz:", e);
                if (btn) btn.classList.remove("tocando");
            });
        }

        // ============================================================
        // AVATAR / PERSONA
        // ============================================================
        function atualizarPersona() {
            const nomes = { ultron: "Ultron", nox: "Nox", nova: "Nova" };
            const emojis = { ultron: "🤖", nox: "🌙", nova: "✨" };
            subNome.textContent = nomes[persona];
            // Tenta carregar avatar real
            const img = new Image();
            img.onload = () => {
                avatarBox.innerHTML = "";
                avatarBox.appendChild(img);
                img.style.width = "100%";
                img.style.height = "100%";
                img.style.objectFit = "cover";
            };
            img.onerror = () => {
                avatarBox.innerHTML = emojis[persona];
            };
            img.src = BASE_URL + "/avatar/" + persona + ".png?" + Date.now();

            // marca botão ativo
            document.querySelectorAll(".persona-btn").forEach(b => {
                b.classList.toggle("on", b.dataset.p === persona);
            });

            localStorage.setItem("ultron_persona", persona);
        }

        btnPersona.addEventListener("click", () => {
            personaBar.classList.toggle("show");
        });

        document.querySelectorAll(".persona-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                persona = btn.dataset.p;
                atualizarPersona();
                personaBar.classList.remove("show");
                const nomes = { ultron: "Ultron", nox: "Nox", nova: "Nova" };
                adicionarMensagem("bot", `Persona alterada para ${nomes[persona]}.`, false);
            });
        });

        // ============================================================
        // CHAT
        // ============================================================
        function adicionarMensagem(tipo, texto, salvar = true, pesquisou = false) {
            const wrap = document.createElement("div");
            wrap.className = "msg-wrap " + tipo;

            const div = document.createElement("div");
            div.className = "msg " + tipo;
            if (pesquisou && tipo === "bot") {
                const tag = document.createElement("span");
                tag.className = "tag-pesquisa";
                tag.textContent = "🔍 pesquisou na web";
                div.appendChild(tag);
                div.appendChild(document.createElement("br"));
            }
            const txt = document.createTextNode(texto);
            div.appendChild(txt);
            wrap.appendChild(div);

            if (tipo === "bot" && salvar) {
                const btnSpeak = document.createElement("button");
                btnSpeak.className = "btn-speak";
                btnSpeak.textContent = "🔊";
                btnSpeak.onclick = () => falarRobotico(texto, btnSpeak);
                wrap.appendChild(btnSpeak);
            }

            chat.appendChild(wrap);
            chat.scrollTop = chat.scrollHeight;

            if (salvar) {
                historico.push({ role: tipo === "user" ? "user" : "assistant", content: texto });
                if (historico.length > 100) historico = historico.slice(-100);
                localStorage.setItem("ultron_historico", JSON.stringify(historico));
            }
            return wrap;
        }

        function renderHistorico() {
            chat.innerHTML = "";
            if (historico.length === 0) {
                adicionarMensagem("bot", "E aí! Sou o Ultron. Manda uma mensagem pra começar! 🤖", false);
            } else {
                for (const m of historico) {
                    adicionarMensagem(m.role === "user" ? "user" : "bot", m.content, false);
                }
            }
        }

        async function enviar() {
            const texto = input.value.trim();
            if (!texto || enviando) return;

            enviando = true;
            input.value = "";
            input.disabled = true;
            send.disabled = true;

            adicionarMensagem("user", texto);

            const wrapTyping = document.createElement("div");
            wrapTyping.className = "msg-wrap bot";
            wrapTyping.innerHTML = '<div class="msg bot typing">Ultron está pensando<span class="typing-dots"></span></div>';
            chat.appendChild(wrapTyping);
            chat.scrollTop = chat.scrollHeight;

            const histEnviado = historico.slice(-MAX_HIST - 1, -1).map(m => ({
                role: m.role, content: m.content
            }));

            try {
                const r = await fetch(BASE_URL + "/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "x-api-key": API_KEY },
                    body: JSON.stringify({
                        texto: texto,
                        usuario_id: usuarioId,
                        historico: histEnviado,
                        persona: persona
                    })
                });

                if (!r.ok) throw new Error("Erro " + r.status);

                const data = await r.json();
                wrapTyping.remove();
                const wrap = adicionarMensagem("bot", data.resposta, true, data.pesquisou);

                // Toca a voz automaticamente
                if (vozAtiva) {
                    const btnSpeak = wrap.querySelector(".btn-speak");
                    falarRobotico(data.resposta, btnSpeak);
                }
            } catch (e) {
                wrapTyping.remove();
                adicionarMensagem("bot", "❌ Erro: " + e.message, false);
            } finally {
                enviando = false;
                input.disabled = false;
                send.disabled = false;
                input.focus();
            }
        }

        send.addEventListener("click", enviar);
        input.addEventListener("keypress", (e) => { if (e.key === "Enter") enviar(); });

        // ============================================================
        // LIMPAR
        // ============================================================
        btnClear.addEventListener("click", () => {
            if (confirm("Apagar toda a conversa?")) {
                historico = [];
                localStorage.setItem("ultron_historico", "[]");
                renderHistorico();
            }
        });

        // ============================================================
        // VOZ ON/OFF
        // ============================================================
        function atualizarBtnVoz() {
            btnVoz.textContent = vozAtiva ? "🔊" : "🔇";
            btnVoz.classList.toggle("on", vozAtiva);
        }
        btnVoz.addEventListener("click", () => {
            vozAtiva = !vozAtiva;
            localStorage.setItem("ultron_voz", vozAtiva ? "on" : "off");
            atualizarBtnVoz();
            if (!vozAtiva && audioAtual) { audioAtual.pause(); audioAtual = null; }
        });

        // ============================================================
        // MICROFONE
        // ============================================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = "pt-BR";
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (e) => {
                input.value = e.results[0][0].transcript;
                enviar();
            };
            recognition.onerror = () => pararMic();
            recognition.onend = () => pararMic();
        }

        function iniciarMic() {
            if (!recognition) { alert("Seu navegador não suporta microfone."); return; }
            try {
                recognition.start();
                gravando = true;
                btnMic.classList.add("gravando");
                btnMic.textContent = "⏹";
            } catch (e) { console.error(e); }
        }
        function pararMic() {
            gravando = false;
            btnMic.classList.remove("gravando");
            btnMic.textContent = "🎤";
            try { recognition && recognition.stop(); } catch(e){}
        }
        btnMic.addEventListener("click", () => gravando ? pararMic() : iniciarMic());

        // ============================================================
        // INICIAR
        // ============================================================
        function iniciar() {
            atualizarPersona();
            atualizarBtnVoz();
            renderHistorico();
            input.focus();
        }

        if (localStorage.getItem("ultron_logado") === "sim") {
            login.style.display = "none";
            iniciar();
        } else {
            senhaInput.focus();
        }

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").catch(() => {});
        }
    </script>
</body>
</html>
